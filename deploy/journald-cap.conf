# Caps the systemd journal on the box. Install as
# /etc/systemd/journald.conf.d/agent-deck-cap.conf (deploy/install-deck.sh does),
# then `systemctl restart systemd-journald`.
#
# MEASURED 2026-09-30: the journal held 3.9 GB on a disk that was filling. It
# holds nothing the deck needs beyond the last few days.
[Journal]
SystemMaxUse=1G
