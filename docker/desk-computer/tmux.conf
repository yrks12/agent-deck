# The desk computer's tmux. One server per container, two sessions:
#   deck   - the owner's own bash (the Terminal tab, and the xterm on the desktop)
#   agent  - read-only: every Bash command the desk's agent runs, mirrored
#            from ~/.deck/agent.log (hooks/cc-mirror.js writes it).
# The account's login shell is nologin on purpose; tmux is told which shell.
set -g default-shell /bin/bash
set -g default-command "bash --login"
set -g default-terminal "screen-256color"
set -g history-limit 20000
# vim needs Escape now, not after tmux's default half second.
set -sg escape-time 10
# Several viewers at once (the Mac, the phone, the desktop's xterm): the
# window follows whoever typed last instead of shrinking to the smallest.
set -g window-size latest
set -g aggressive-resize on
# Let the client terminal keep its own scrollback and selection: tmux draws
# in the normal screen instead of the alternate one.
set -ga terminal-overrides ",xterm*:smcup@:rmcup@"
# The app has its own deck/agent switch; a status line would be a second one.
set -g status off
set -g set-titles off
