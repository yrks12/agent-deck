<script>
// One line per video. A file is videos/shaliach-<id>.mp4 (from the site-videos release)
// with its poster videos/shaliach-<id>.jpg from the same release.
var TOUR = [
  ["launch", "The launch film", "I left my desk at 6pm. My agents didn't."],
  ["english", "The tour", "One café, one week: text Atlas, get a whole team."],
  ["everyone", "Everyone", "Founders, accountants, clinics, shops: the short version for all of them."]
];
var WORK = [
  ["founder", "Founders", "It's 11pm. You're still answering emails."],
  ["accountant", "Accountants", "Fourteen clients still owe you receipts."],
  ["agency", "Agencies", "Friday, 6pm. Six client reports due Monday."],
  ["clinic", "Clinics", "Patients overdue for a check-up, and nobody has time to call."],
  ["ecommerce", "Online shops", "“Where's my order?” Again."],
  ["insurance", "Insurance brokers", "One renewal. Five carrier portals. The same details, five times."],
  ["realestate", "Estate agents", "A buyer enquired at 9:40pm. You saw it at 8am."],
  ["developers", "Developers", "You close the laptop. Your agents stop."]
];
function fill(id, rows) {
  var el = document.getElementById(id);
  rows.forEach(function (r) {
    var f = document.createElement('figure');
    f.innerHTML = '<video controls playsinline preload="none" poster="videos/shaliach-' + r[0] + '.jpg">' +
      '<source src="videos/shaliach-' + r[0] + '.mp4" type="video/mp4"></video>' +
      '<figcaption><b></b><span></span></figcaption>';
    f.querySelector('b').textContent = r[1];
    f.querySelector('span').textContent = r[2];
    el.appendChild(f);
  });
}
fill('tour', TOUR); fill('work', WORK);
</script>
